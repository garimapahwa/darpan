<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Darpan Setup</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: 320px;
        padding: 28px;
        border: 1px solid #30363d;
        border-radius: 16px;
        background: #161b22;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        color: #8b949e;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #e6edf3;
        font-size: 14px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        border-radius: 999px;
        border: none;
        background: #58a6ff;
        color: #06121f;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .error {
        color: #f85149;
        font-size: 12px;
        margin-top: 10px;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Darpan</h1>
      <p>Paste your Sarvam AI API key to get started. It's stored only on this machine.</p>
      <input id="key" type="password" placeholder="Sarvam API key" autofocus />
      <button id="save">Save &amp; continue</button>
      <div class="error" id="error"></div>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
